<html>
  <center style="width: 100%; background: #eeeeee; vertical-align:middle;">
    <div style="display:none;font-size:1px;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;mso-hide:all;font-family: Roboto, Helvetica Neue, Helvetica, Arial, sans-serif;"></div>
    <div style="width: 600px; max-width:100%; height:100%; margin: auto; padding:20px 0;">
      <table cellspacing="0" cellpadding="0" border="0" width="600" align="center">
        <tbody>
          <tr>
            <td>
              <table cellspacing="0" cellpadding="0" border="0" align="center" width="100%" height="100%" style="max-width: 100%; height:100%;">
                <tbody>
                  <tr>
                    <td valign="middle">
                      <table cellspacing="0" cellpadding="0" border="0" align="center" bgcolor="#ffffff" width="100%" style="max-width: 100%;background-color: #fff;">
                        <tbody>
                          <tr>
                            <td>
                              <table cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tbody>
                                  <tr>
                                    <td style="text-align:center;padding:20px 30px; font-family: Roboto, Helvetica Neue, Helvetica, Arial, sans-serif; font-size: 15px; mso-height-rule: exactly; line-height: 20px; color: #555555; border-bottom:1px solid #eeeeee;">
                                      <img height='50' alt='logo' src='{logo_url}'>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                            </td>
                          </tr>
                          <tr>
                            <td>
                              <table cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tbody>
                                  <tr>
                                    <td style="padding: 30px; font-size: 14px; line-height: 24px; color: rgb(117, 117, 117);">
                                      <p style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: rgb(117, 117, 117);">
                                        Sevgili {laborant_name},
                                        </p>
                                      
                                      
                                      <p style="font-family: Arial, Helvetica, sans-serif; box-sizing: border-box; margin: 0px 0px 11px; color: rgb(117, 117, 117); font-size: 14px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 300; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">
                                        {inline_1} <br style="box-sizing: border-box;">
                                      </p>
                                      
                                      <p style="box-sizing: border-box; margin: 0px 0px 11px; color: rgb(117, 117, 117); font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 300; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">
                                        {inline_2} <br style="box-sizing: border-box;">
                                      </p>
                                      
                                      <p style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: rgb(117, 117, 117);">
                                        <!--StartFragment-->
                                        <!--EndFragment-->
                                      </p>
                                      <p style="font-family: Arial, Helvetica, sans-serif; box-sizing: border-box; margin: 0px 0px 11px; color: rgb(117, 117, 117); font-size: 14px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 300; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">
                                        Sevgilerimizle, <br style="box-sizing: border-box;">
                                        <b style="box-sizing: border-box; font-weight: bold !important;">{sender_department}</b>
                                      </p>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                      <table cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 680px;">
                        <tbody>
                          <tr>
                            <td style="padding:30px 10px;width: 100%;font-size: 12px; font-family: Roboto, Helvetica Neue, Helvetica, Arial, sans-serif; mso-height-rule: exactly; line-height:18px; text-align: center; color: #757575;">
                              <p style="margin:5px 0; font-size: 14px; line-height:24px; font-family: Roboto, Helvetica Neue, Helvetica, Arial, sans-serif; mso-height-rule: exactly; line-height:18px; text-align: center; color: #757575;">Yardıma ihtiyacınız varsa veya sorularınız varsa, lütfen <a href="mailto:{support_mail}" style="color:#3f51b5; text-decoration:none;" class="link">{support_mail}</a> iletişime geçin. </p>
                              <p style="margin:5px 0; font-size: 14px; line-height:24px; font-family: Roboto, Helvetica Neue, Helvetica, Arial, sans-serif; mso-height-rule: exactly; line-height:18px; text-align: center; color: #757575;">
                                <a href="https://{app_domain}" style="color:#3f51b5; text-decoration:none;" class="link" target="_blank">{app_domain}</a>
                              </p>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </td>
                  </tr>
                </tbody>

          </tr>
